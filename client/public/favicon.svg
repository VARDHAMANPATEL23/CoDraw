<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101E"/>
      <stop offset="50%" stop-color="#0B1D33"/>
      <stop offset="100%" stop-color="#102A4C"/>
    </linearGradient>

    <!-- Outer Glow Border -->
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3F72AF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Left Bracket < Gradient -->
    <linearGradient id="bracketLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Right Bracket > Gradient -->
    <linearGradient id="bracketRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Drafting Stylus Gradient -->
    <linearGradient id="stylusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0F2FE"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Canvas Grid Dots -->
    <pattern id="canvasDots2" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#38BDF8" fill-opacity="0.15"/>
    </pattern>

    <!-- Ambient Shadow -->
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bgGrad2)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="url(#borderGrad2)" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#canvasDots2)"/>

  <!-- Radial Glow Behind Mark -->
  <radialGradient id="centerGlow2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
    <stop offset="60%" stop-color="#3F72AF" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow2)"/>

  <g filter="url(#softShadow2)">
    <!-- LEFT CODE BRACKET < -->
    <path d="M 218 132
             L 132 238
             C 118 252 118 260 132 274
             L 218 380"
          fill="none" stroke="url(#bracketLeftGrad)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- RIGHT CODE BRACKET > -->
    <path d="M 294 132
             L 380 238
             C 394 252 394 260 380 274
             L 294 380"
          fill="none" stroke="url(#bracketRightGrad)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- DRAFTING STYLUS / PEN SLASH / -->
    <!-- Stylus Body -->
    <line x1="288" y1="144" x2="228" y2="352"
          stroke="url(#stylusGrad)" stroke-width="32" stroke-linecap="round"/>

    <!-- Stylus Drawing Tip (Precision nib highlight) -->
    <circle cx="224" cy="364" r="10" fill="#38BDF8" fill-opacity="0.5"/>
    <circle cx="224" cy="364" r="6" fill="#FFFFFF"/>

    <!-- Vector Anchor Nodes at Bracket Vertices -->
    <circle cx="128" cy="256" r="14" fill="#FFFFFF" stroke="#06101E" stroke-width="5"/>
    <circle cx="384" cy="256" r="14" fill="#FFFFFF" stroke="#06101E" stroke-width="5"/>
    
    <!-- Coordinate Origin Node at Stylus Midpoint -->
    <circle cx="256" cy="256" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3"/>
  </g>
</svg>